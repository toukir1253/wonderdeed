<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WonderDeed – Own Your Universe</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#02030a;color:#e8ecff;font:14px system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:8px;background:linear-gradient(#02030aee,#02030a00);z-index:2}
h1{font-size:16px;letter-spacing:1px}
h1 small{display:block;font-size:10px;color:#8ab;font-weight:400;letter-spacing:2px}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
button,input{background:#1a2140;color:#e8ecff;border:1px solid #3a4680;border-radius:8px;padding:7px 10px;font-size:13px}
button.on{background:#4a5cff}
input{width:150px}
#lg{font-size:11px;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px}
#p{position:fixed;left:8px;right:8px;bottom:26px;background:#0b1030ee;border:1px solid #4a5cff;border-radius:12px;padding:12px;z-index:3;display:none;line-height:1.7;max-width:420px}
#p button{margin-top:6px}
#p #x{position:absolute;top:6px;right:6px;margin:0;padding:2px 8px}
#ms{position:fixed;top:50%;left:0;right:0;text-align:center;z-index:4;color:#cde;font-size:15px;pointer-events:none}
#ft{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:#89a;z-index:2}
</style></head><body>
<canvas id="c"></canvas>
<div id="top">
<h1>WONDERDEED<small>OWN YOUR UNIVERSE</small></h1>
<div class="row" id="tabs"></div>
<div class="row"><input id="q" placeholder="Plot ID: WD-MOON-000005"><button id="go">Search</button><button id="lo">Low</button></div>
<div id="lg"></div>
</div>
<div id="ms"></div>
<div id="p"></div>
<div id="ft">ভার্চুয়াল/কাল্পনিক ডিজিটাল সম্পদ – বাস্তব জমির মালিকানা নয় | Moon data: NASA/GSFC/SVS, LRO | Prototype Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const W={
MOON:{n:'চাঁদ / Moon',base:49,relief:1.6,col:'lroc_color_2k.jpg',dem:'ldem_3_8bit.jpg',pal:[[60,60,60],[200,200,200]]},
ISLAND:{n:'দ্বীপ / Island',base:79,relief:1.2,kind:'island'},
MARS:{n:'মঙ্গল / Mars',base:59,relief:1.4,pal:[[85,32,18],[205,115,72]]},
PLANET:{n:'গ্রহ / Planet',base:39,relief:1.2,pal:[[35,18,90],[160,125,235]]}
};
const SC={a:0x22dd66,s:0xee3344,r:0xffcc22,m:0x3b82ff,x:0x888888};
const SN={a:'Available',s:'Sold',r:'Reserved',m:'My Property',x:'Unavailable'};
const RN=['Region A','Region B','Region C','Region D'];
$('lg').innerHTML=Object.keys(SC).map(k=>`<span><i style="background:#${SC[k].toString(16).padStart(6,'0')}"></i>${SN[k]}</span>`).join('');

const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,1000);
S.add(new THREE.AmbientLight(0xffffff,.35));
const L=new THREE.DirectionalLight(0xffffff,1.25);L.position.set(60,25,35);S.add(L);
(()=>{const a=[];for(let i=0;i<800;i++)a.push(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(400));
S.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(a),new THREE.PointsMaterial({color:0xffffff,size:1.3})))})();

const RAD=20;
let cur='MOON',G=null,sph=null,meshes=[],sel=null,P={},low=false,busy=false,D=null;
let th=Math.PI/2,ph=Math.PI/2,rad=40,gth=null,gph=null,grad=null;

/* ---------- maps ---------- */
const hsh=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return hsh(i,j)*(1-u)*(1-v)+hsh(i+1,j)*u*(1-v)+hsh(i,j+1)*(1-u)*v+hsh(i+1,j+1)*u*v};
const fbm=(x,y)=>{let s=0,a=.5;for(let o=0;o<5;o++){s+=a*vn(x,y);x*=2;y*=2;a/=2}return s/.97};
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);

function proc(w){
const Wd=512,Ht=256,cc=cvs(Wd,Ht),dc=cvs(Wd,Ht),cx=cc.getContext('2d'),dx=dc.getContext('2d');
const ci=cx.createImageData(Wd,Ht),di=dx.createImageData(Wd,Ht);
for(let y=0;y<Ht;y++)for(let x=0;x<Wd;x++){
const n=fbm(x/Wd*8,y/Ht*4),k=(y*Wd+x)*4;let c,h=n;
if(w.kind=='island'){const d=Math.hypot((x/Wd-.5)*2,(y/Ht-.5)*1.4),land=n*.8+(1-d*1.6)*.7;
if(land>.55){c=lerp([40,130,60],[150,130,80],Math.min(1,(land-.55)*3));h=.5+(land-.55)*.9}else{c=lerp([15,70,140],[40,140,200],land);h=.5}}
else c=lerp(w.pal[0],w.pal[1],n);
ci.data.set([c[0],c[1],c[2],255],k);const g=h*255;di.data.set([g,g,g,255],k)}
cx.putImageData(ci,0,0);dx.putImageData(di,0,0);
return{tex:new THREE.CanvasTexture(cc),dem:{w:Wd,h:Ht,d:di.data}}}

async function maps(k){const w=W[k];
if(w.col){try{const[a,b]=await Promise.all([loadImg(w.col),loadImg(w.dem)]);
const t=new THREE.Texture(a);t.needsUpdate=true;
const c=cvs(b.width,b.height),x=c.getContext('2d');x.drawImage(b,0,0);
return{tex:t,dem:{w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height).data},real:1}}
catch(e){const r=proc(w);r.real=0;return r}}
return proc(w)}

const hv=(u,v)=>{const px=Math.min(D.w-1,Math.max(0,u*D.w|0)),py=Math.min(D.h-1,Math.max(0,(1-v)*D.h|0));return D.d[(py*D.w+px)*4]/255};
const dir=(u,v)=>{const f=u*2*Math.PI,t=(1-v)*Math.PI;return new THREE.Vector3(-Math.cos(f)*Math.sin(t),Math.cos(t),Math.sin(f)*Math.sin(t))};
const pos=(u,v,off,rl)=>dir(u,v).multiplyScalar(RAD+(hv(u,v)-.5)*rl+off);

/* ---------- plots ---------- */
const U0=.5-.14,DU=.28/6,V1=.5+.139,DV=.278/6;
function data(k){if(P[k])return;const a=[],w=W[k];
for(let i=0;i<36;i++){const row=i/6|0,col=i%6,reg=(row<3?0:2)+(col<3?0:1);
a.push({i,id:`WD-${k}-${String(i+1).padStart(6,'0')}`,reg,price:Math.round(w.base*(1+reg*.15)*(1+(i%5)*.05)),st:i%13==5?'x':i%7==0?'s':i%11==0?'r':'a',u0:U0+col*DU,v1:V1-row*DV})}
P[k]=a}

function label(n){const c=cvs(64,64),x=c.getContext('2d');x.fillStyle='#fff';x.font='bold 34px sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#000';x.shadowBlur=6;x.fillText(n,32,32);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(1.8,1.8,1);s.renderOrder=5;return s}

function recolor(pl,on){pl.mesh.material.color.setHex(SC[pl.st]);pl.mesh.material.opacity=on?.85:.45;pl.ln.material.color.setHex(on?0xffffff:SC[pl.st])}

async function build(k){
if(busy)return;busy=true;$('ms').textContent='লোড হচ্ছে...';$('p').style.display='none';
const w=W[k],m=await maps(k);cur=k;D=m.dem;data(k);
if(G)S.remove(G);G=new THREE.Group();S.add(G);
if(k=='MOON'&&!m.real)alert('NASA-র ছবি পাওয়া যায়নি (lroc_color_2k.jpg ও ldem_3_8bit.jpg GitHub-এ index.html-এর পাশে আছে কিনা দেখুন)। এখন সাধারণ চাঁদ দেখানো হচ্ছে।');
m.tex.encoding=THREE.sRGBEncoding;m.tex.anisotropy=4;
const g=new THREE.SphereGeometry(RAD,128,64),p=g.attributes.position,uv=g.attributes.uv;
for(let i=0;i<p.count;i++){const u=uv.getX(i),v=uv.getY(i),q=dir(u,v).multiplyScalar(RAD+(hv(u,v)-.5)*w.relief);p.setXYZ(i,q.x,q.y,q.z)}
g.computeVertexNormals();
sph=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:m.tex,roughness:1,metalness:0}));G.add(sph);
if(w.kind=='island'){G.add(new THREE.Mesh(new THREE.SphereGeometry(RAD+.02,64,32),new THREE.MeshBasicMaterial({color:0x1f6fb5,transparent:true,opacity:.0})))}
meshes=[sph];
P[k].forEach(pl=>{const n=4,vs=[],ix=[];
for(let a=0;a<=n;a++)for(let b=0;b<=n;b++){const q=pos(pl.u0+DU*a/n,pl.v1-DV*b/n,.12,w.relief);vs.push(q.x,q.y,q.z)}
for(let a=0;a<n;a++)for(let b=0;b<n;b++){const i=a*(n+1)+b;ix.push(i,i+1,i+n+1,i+1,i+n+2,i+n+1)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(vs,3));pg.setIndex(ix);
const me=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:SC[pl.st],transparent:true,opacity:.45,side:THREE.DoubleSide,depthWrite:false}));me.userData.pl=pl;
const E=[];for(let t=0;t<n;t++)E.push([pl.u0+DU*t/n,pl.v1]);for(let t=0;t<n;t++)E.push([pl.u0+DU,pl.v1-DV*t/n]);
for(let t=0;t<n;t++)E.push([pl.u0+DU*(1-t/n),pl.v1-DV]);for(let t=0;t<n;t++)E.push([pl.u0,pl.v1-DV*(1-t/n)]);
const ln=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(E.map(([u,v])=>pos(u,v,.16,w.relief))),new THREE.LineBasicMaterial({color:SC[pl.st]}));
const lb=label(pl.i+1);lb.position.copy(pos(pl.u0+DU/2,pl.v1-DV/2,.9,w.relief));
pl.mesh=me;pl.ln=ln;G.add(me,ln,lb);meshes.push(me)});
sel=null;gth=Math.PI/2;gph=Math.PI/2;grad=40;
[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));
$('ms').textContent='';busy=false}

Object.keys(W).forEach(k=>{const b=document.createElement('button');b.textContent=W[k].n;b.dataset.k=k;b.onclick=()=>build(k);$('tabs').appendChild(b)});

function show(pl){
if(sel)recolor(sel,0);sel=pl;recolor(pl,1);
const c=dir(pl.u0+DU/2,pl.v1-DV/2);gph=Math.acos(c.y);gth=Math.atan2(c.x,c.z);grad=30;
const own=pl.st=='s'?'Hidden User':pl.st=='m'?'You':'—';
$('p').innerHTML=`<button id="x">✕</button><b>${pl.id}</b><br>World: ${W[cur].n}<br>Region: ${RN[pl.reg]}<br>Plot Size: 1,000 sq m (virtual)<br>Price: $${pl.price}<br>Status: <b style="color:#${SC[pl.st].toString(16).padStart(6,'0')}">${SN[pl.st]}</b><br>Owner: ${own}${pl.st=='a'?'<br><button id="b">Buy Now (Demo)</button>':''}`;
$('p').style.display='block';
$('x').onclick=()=>{recolor(pl,0);sel=null;$('p').style.display='none'};
if($('b'))$('b').onclick=()=>{if(confirm('Demo: এটি প্রোটোটাইপ, আসল পেমেন্ট নেই। জমিটি "My Property" করবেন?')){pl.st='m';show(pl)}}}

/* ---------- controls ---------- */
const rc=new THREE.Raycaster(),cv=$('c'),pt=new Map();let mv=0,t0=0,pd=0;
const clampR=r=>Math.min(90,Math.max(26,r));
function pick(x,y){rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);const h=rc.intersectObjects(meshes)[0];if(h&&h.object.userData.pl)show(h.object.userData.pl)}
function pinch(){if(pt.size<2)return 0;const a=[...pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==1){mv=0;t0=Date.now()}pd=pinch();gth=null};
cv.onpointermove=e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);
if(pt.size==1){const dx=e.clientX-o[0],dy=e.clientY-o[1];mv+=Math.abs(dx)+Math.abs(dy);const s=.004*rad/40;th-=dx*s;ph=Math.min(Math.PI-.2,Math.max(.2,ph-dy*s))}
else if(pt.size==2){const d=pinch();if(pd)rad=clampR(rad*pd/d);pd=d;mv+=10}};
cv.onpointerup=e=>{if(pt.size==1&&mv<8&&Date.now()-t0<500)pick(e.clientX,e.clientY);pt.delete(e.pointerId)};
cv.onpointercancel=e=>pt.delete(e.pointerId);
cv.onwheel=e=>{rad=clampR(rad*(1+e.deltaY*.001))};

$('go').onclick=async()=>{const v=$('q').value.toUpperCase(),m=v.match(/(MOON|ISLAND|MARS|PLANET)/),d=v.match(/(\d+)\s*$/);
if(m&&m[1]!=cur)await build(m[1]);
if(d){const pl=P[cur][+d[1]-1];if(pl)show(pl);else alert('Plot পাওয়া যায়নি (1-36)')}};
$('lo').onclick=()=>{low=!low;$('lo').classList.toggle('on',low);size()};

function size(){R.setPixelRatio(low?.7:Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();build('MOON');
(function loop(){requestAnimationFrame(loop);
if(gth!==null){let d=gth-th;d=Math.atan2(Math.sin(d),Math.cos(d));th+=d*.08;ph+=(gph-ph)*.08;rad+=(grad-rad)*.08}
cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0);R.render(S,cam)})();
</script></body></html>
